<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Barbearia Prime</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

  <header class="header">
    <div class="logo">
      <i class="fa-solid fa-scissors"></i>
      <span>Barbearia Prime <small class="admin-badge">Admin</small></span>
    </div>
    <nav class="navbar">
      <a href="index.html">Voltar ao Site</a>
    </nav>
  </header>

  <section class="section">
    <div class="section-title">
      <span>Painel de Controle</span>
      <h2>Agendamentos Realizados</h2>
      <p class="admin-helper-text">Abra um agendamento para visualizar os detalhes e cancelar quando necessário.</p>
    </div>

    <div class="admin-stats-grid">
      <div class="admin-stat-card">
        <p class="admin-stat-label">Total de Agendamentos</p>
        <h3 id="statsTotalAppointments">--</h3>
      </div>
      <div class="admin-stat-card">
        <p class="admin-stat-label">Agendamentos de Hoje</p>
        <h3 id="statsTodayAppointments">--</h3>
      </div>
      <div class="admin-stat-card">
        <p class="admin-stat-label">Serviço Mais Requisitado</p>
        <h3 id="statsMostRequestedService">--</h3>
        <span id="statsMostRequestedServiceCount" class="admin-stat-subtext">--</span>
      </div>
    </div>

    <div id="adminFeedback" class="form-feedback admin-feedback" aria-live="polite"></div>

    <div class="admin-container" id="appointmentsList">
      <div class="no-data">Carregando agendamentos...</div>
    </div>
  </section>

  <script src="admin-script.js"></script>
</body>
</html>
